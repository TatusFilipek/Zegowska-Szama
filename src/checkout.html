<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zegowska Szama - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styl.css">
</head>
<body class="vh-100 d-flex flex-column">
    <div class="header text-lowercase fs-4 d-flex align-items-center gap-4 dropdown p-2 ps-3">
        <div class="my-auto">
            <a href="main.html"><img src="../design/photos/zeg-icon.png" style="width: 55px;"></a>
        </div>
        <div class="my-auto flex-fill fs-3">
            <a href="main.html">Szama</a>
        </div>

        <div class="d-none d-md-flex gap-5 my-auto fs-3 me-3">
            <a class="text-capitalize" href="profile.html">Profile</a>
            <a class="text-capitalize" href="checkout.html">Checkout</a>
            <a class="text-capitalize" href="notifications.html">Notifications</a>
            <a class="text-capitalize" href="offers.html">Offers</a>
            <a class="text-capitalize" href="manage.html">Manage</a>
        </div>
        
        <div class="my-auto d-md-none" data-bs-toggle="dropdown" aria-expanded="false">
            <img class="btn bi bi-list m-0 p-0" src="../design/photos/burger.png" style="width: 55px;">
        </div>
        <ul class="row dropdown-menu custom-dropdown-menu w-100 mt-1 p-0 d-md-none">
            <li><a class="dropdown-item custom-item" href="profile.html">Profile</a></li>
            <li><a class="dropdown-item custom-item" href="checkout.html">Checkout</a></li>
            <li><a class="dropdown-item custom-item" href="notifications.html">Notifications</a></li>
            <li><a class="dropdown-item custom-item" href="offers.html">Offers</a></li>
            <li><a class="dropdown-item custom-item" href="manage.html">Manage</a></li>
        </ul>
    </div>

    <div class="flex-fill container-fluid px-4 py-3 overflow-auto d-flex flex-column align-items-center justify-content-center">
        <!-- Progress bar -->
        <div class="mb-5 w-100" style="max-width: 600px;">
            <div class="d-flex justify-content-between mb-3">
                <div class="d-flex flex-column align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2" style="width: 40px; height: 40px; background-color: #5a8e7a; color: white; font-weight: bold;">1</div>
                    <small style="color: #2e3d52;">Checkout</small>
                </div>
                <div class="flex-grow-1 d-flex align-items-center" style="margin: 0 1rem; margin-top: 0.7rem;">
                    <div style="height: 2px; width: 100%; background-color: #5a8e7a;"></div>
                </div>
                <div class="d-flex flex-column align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2" style="width: 40px; height: 40px; background-color: #5a8e7a; color: white; font-weight: bold;">2</div>
                    <small style="color: #2e3d52;">Payment</small>
                </div>
                <div class="flex-grow-1 d-flex align-items-center" style="margin: 0 1rem; margin-top: 0.7rem;">
                    <div style="height: 2px; width: 100%; background-color: #5a8e7a;"></div>
                </div>
                <div class="d-flex flex-column align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2" style="width: 40px; height: 40px; background-color: #3b4257; color: #a2a2bd; font-weight: bold;">3</div>
                    <small style="color: #a0a0b0;">Processing</small>
                </div>
                <div class="flex-grow-1 d-flex align-items-center" style="margin: 0 1rem; margin-top: 0.7rem;">
                    <div style="height: 2px; width: 100%; background-color: #c9a3a3;"></div>
                </div>
                <div class="d-flex flex-column align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2" style="width: 40px; height: 40px; background-color: #7a7a8e; color: white; font-weight: bold;">4</div>
                    <small style="color: #a0a0b0;">Collect</small>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div id="checkout-content" class="text-center" style="max-width: 600px;">
            <h2 class="display-5 fw-bold mb-4" style="color: #2e3d52;">Please pay 5.99$</h2>
            <h3 class="display-6 fw-normal mb-4" style="color: #2e3d52;">at the register</h3>
            
            <p style="color: #4a5568; font-size: 1.1rem; margin-bottom: 2rem;">An employee will<br>confirm your payment</p>

            <button class="btn fw-semibold px-6 py-2 rounded-2" style="background-color: #3b4257; color: #a2a2bd; border: none;">Cancel</button>
        </div>

        <div id="payment-content" class="text-center d-none" style="max-width: 600px;">
            <h2 class="display-5 fw-bold mb-5" style="color: #2e3d52;">Payment complete</h2>
            
            <h3 class="display-6 fw-bold" style="color: #2e3d52;">Your number is <span style="color: #5a8e7a;">51</span></h3>
        </div>
    </div>

    <div class="p-3 footer text-lowercase fs-5">School's website</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
